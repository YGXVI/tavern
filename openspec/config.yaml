schema: spec-driven
context: |
  Пиши артефакты на русском. Синтаксис Requirement, Scenario, SHALL/MUST, WHEN/THEN сохраняй для валидатора.
  Сначала читай AGENTS.md и docs/open-spec.md. Работа команды из трёх человек: один change — один ответственный человек и его агент; другой участник проверяет план.
  Текущее поведение — openspec/specs; предлагаемые изменения — openspec/changes. Планы и непроверенные PR не являются реализованными функциями.
  Продукт «Распутье», только D&D 5e 2014. Discord-вход — локальная имитация; сервер/провайдер не выбраны (DEC-008). Старый прототип доступен в /legacy/.
  Новые задачи резервируются в опубликованных GitHub Issues; старые TASK-006–009 сохраняют заявки docs/status.md. Публикация Issue не является техническим lock.
  Сохраняй ключи и данные без молчаливых миграций, не подменяй чужие общие файлы. Merge в main запускает Vercel; объединяет владелец/назначенный интегратор.
rules:
  proposal:
    - 'Укажи TASK-ID, Issue, ответственного человека/агента, проверяющего, интегратора, ветку и полный SHA базы; неизвестные значения явно оставляй неназначенными.'
    - 'Укажи цель, вне объёма, capabilities, зависимости, затрагиваемые файлы/контракты, пересечения и подтверждение плана другим участником.'
  specs:
    - 'Для каждого Requirement используй SHALL или MUST и минимум один Scenario с WHEN/THEN; не превращай будущий план в текущее поведение.'
    - 'Для изменений требований используй ADDED/MODIFIED/REMOVED; сохраняй полные изменяемые требования и совместимость.'
  design:
    - 'Опиши контракты данных/DOM/API, владение общими файлами, миграцию, проверку, ограничения и откат.'
  tasks:
    - 'Делай проверяемые чекбоксы; планирование, реализация и проверки — отдельные действия. Merge и deploy отслеживаются в Issue, а не выдаются за выполненные задачи реализации.'
operations:
  apply:
    guidance:
      - 'До кода проверь опубликованную заявку, согласование плана и пересечения. При недоступном GitHub готовь только локальный дифф с явным блокером.'
  archive:
    guidance:
      - 'Архивируй в ветке после проверки реализации; обнови main specs в том же PR. Архив не доказывает merge или публикацию.'
