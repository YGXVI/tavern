schema: spec-driven
context: |
  Пиши артефакты на русском; Requirement, Scenario, SHALL/MUST, WHEN/THEN сохраняй.
  Канонический процесс — AGENTS.md; команды change — docs/open-spec.md; ветки/хозяева — docs/workstreams.md. Не вводи второй источник процедур.
  Применяй уровень L0/L1/L2 из AGENTS.md. Change нужен L1/L2. Не требуй согласования плана L1 до реализации; L2 требует человеческого подтверждения. Условия review/таймаута/merge — только по AGENTS.md.
  Новая TASK равна номеру Issue; существующие исторические TASK/Issue/change сохраняются. Сначала получить номер Issue, затем назвать change task-NNN-slug.
  openspec/specs описывает соответствующую ревизию, changes — предложения; невлитое и непроверенное не объявляй поведением main.
  Продукт «Распутье», D&D 5e 2014. Песочницу/сервер, данные и ограничения сверяй по docs/data.md и решениям. Не меняй контракты, ключи, секреты и чужую работу попутно.
  PR готовится прямо из существующей постоянной ветки; новые task/plan/review-ветки запрещены. Один открытый интеграционный PR на направление; посторонние задачи не добавлять в ожидающий окончательного review объём. Merge сохраняет историю, main запускает Vercel; архив не доказывает review/merge/deploy.
rules:
  proposal:
    - 'Укажи уровень, TASK/Issue/change, человека/агента, проверяющего, интегратора, направление/постоянную ветку и SHA базы; неизвестные роли оставь неназначенными.'
    - 'Опиши цель, границы, capabilities, зависимости, контракты и основания согласования по уровню AGENTS.md.'
  specs:
    - 'Каждому Requirement нужны SHALL/MUST и Scenario WHEN/THEN; требования не должны дублировать процедуры AGENTS.md.'
    - 'Используй ADDED/MODIFIED/REMOVED, для MODIFIED сохраняй полное изменяемое требование и совместимость.'
  design:
    - 'Опиши контракты, миграцию/откат, проверки и ограничения.'
  tasks:
    - 'Разделяй планирование, реализацию и фактические проверки. Review, merge и deploy фиксируются в Issue/PR и не доказываются галочками.'
operations:
  apply:
    guidance:
      - 'До реализации проверь опубликованную заявку, пересечения и условия уровня в AGENTS.md. При недоступном GitHub назови блокер; не заявляй резервирование.'
  archive:
    guidance:
      - 'Архивируй проверенную завершённую реализацию с синхронизацией specs. Архив не является review, merge или публикацией.'
