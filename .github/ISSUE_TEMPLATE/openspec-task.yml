name: Задача команды
description: Заявка L0/L1/L2; правила в AGENTS.md
title: "[TASK-NNN] После создания подставить номер Issue"
body:
  - type: textarea
    id: identity
    attributes:
      label: Задача и участники
      description: Новая TASK равна номеру созданной Issue; существующие исторические соответствия сохраняются. Для L0 change необязателен.
      value: |
        TASK-ID (после создания Issue):
        Уровень L0/L1/L2 и основание:
        Change (L1/L2):
        Автор (человек + агент/сессия):
        Хозяин направления (если назначен):
        Проверяющий (L0/L1 — другой человек или его агент; L2 — человек):
        Интегратор (по уровню и условиям AGENTS.md):
        Статус: proposed
        Обновлено (дата, время и часовой пояс):
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Результат и границы
      description: Что меняется, вне объёма, критерии приёмки; классификация по AGENTS.md.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: База и зависимости
      value: |
        Направление / постоянная ветка:
        Активный исполнитель / передача:
        Снимок PR:
        Полный SHA свежего main:
        Файлы/контракты:
        Зависимости / пересечения:
        Change / PR:
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Согласование и review
      description: Применять AGENTS.md. L2 требует человеческого подтверждения плана до кода; L1 не требует. Таймаут L1 не является аппрувом.
      value: |
        L2 — человек, ссылка и SHA подтверждённого плана (иначе неприменимо):
        Уведомления о пересечениях: адресат, область, время:
        Запрос review: адресат, SHA, ссылка, время:
        Результат review / открытые замечания:
        L1 по таймауту: запрос, истечение 24 часов, CI, отсутствие блокеров, кто проведёт последующий review:
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Передача и проверки
      description: Статусы по AGENTS.md — proposed/reserved/in_progress/review/merged/published, дополнительно blocked/paused. Историческое done не переносить в новые задачи.
      value: |
        Проверки и непроверенные сценарии:
        PR / commit:
        Merge SHA (для merged):
        Actions / deploy (для published, если применимо):
        Незавершённое последующее review L1:
        Ограничения / следующий шаг:
