name: Задача OpenSpec
description: План и координация одного изменения
title: "[TASK-ID] Краткий результат"
body:
  - type: textarea
    id: identity
    attributes:
      label: Задача и участники
      description: TASK-ID и номер Issue различаются. Имена и роли подтверждаются участниками; правила одинаковы для всех.
      value: |
        TASK-ID:
        Change: task-ID-slug
        Автор (человек + агент/сессия):
        Проверяющий (другой человек):
        Интегратор (согласованный участник с доступом, не автор PR):
        Статус: proposed
        Обновлено (дата, время +05:00):
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Результат и границы
      description: Что меняется, что вне объёма, критерии приёмки.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: База, файлы и зависимости
      value: |
        Направление:
        Постоянная ветка направления:
        Активный исполнитель ветки / передача:
        Полный SHA свежего main:
        Файлы/контракты:
        Другие задачи и открытый PR в этой ветке:
        Зависимые Issues/PR:
        Пересечения и согласованный порядок:
        Ссылка на change/план/PR:
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Подтверждение плана
      description: Ссылка на комментарий другого участника с подтверждением конкретной ревизии плана. Пока его нет, код не начинать; план готовить можно.
      value: Пока не подтверждено.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Передача и проверки
      value: |
        Проверки и непроверенные сценарии:
        PR / commit:
        В main (подтверждение):
        Опубликовано (Actions URL):
        Ограничения / следующий шаг:
