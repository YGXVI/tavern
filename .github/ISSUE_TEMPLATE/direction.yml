name: Направление
description: Новая Issue — исключение (AGENTS.md). Сначала проверьте, нельзя ли добавить работу в существующее направление.
title: "Название направления"
body:
  - type: textarea
    id: card
    attributes:
      label: Карточка направления
      description: Актуализируйте тело Issue вместо серии комментариев.
      value: |
        **Цель.**
        **Ответственный:** **Ветки:**
        **Статус:**

        ### Сделано
        -

        ### Осталось
        - [ ]

        ### Решения
        -

        ### Зависимости
        -

        ### История
        Старые Issues, активные PR:

        **Следующая задача:**
    validations:
      required: true
