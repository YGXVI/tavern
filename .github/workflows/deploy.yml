# Тесты на каждый пуш в main и test и на каждый пул-реквест.
# Пуш в main с зелёными тестами сам выкатывается на https://rasputye.vercel.app,
# пуш в test — на тестовый стенд https://dropdice-test.vercel.app (отдельные проекты
# Vercel и Supabase, плашка «Тестовый стенд»; настройка — docs/test-environment.md).
# Секреты: VERCEL_TOKEN (сайт), VERCEL_TOKEN_TEST и TEST_DATABASE_URL (стенд);
# переменные стенда: TEST_SUPABASE_URL, TEST_SUPABASE_KEY. Settings → Secrets and variables → Actions.
name: Тесты и деплой

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_Qqev4iL1dRGzPyREzHXGYMR6
  VERCEL_PROJECT_ID: prj_PbZ0W6JxfcA7gpEeErQwNIYZcILB

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Проверить OpenSpec
        env:
          OPENSPEC_TELEMETRY: '0'
        run: |
          npm run spec:validate
          npm run spec:validate:archive
      - run: npm test

  deploy:
    name: Деплой на Vercel
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить токен
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Нет секрета VERCEL_TOKEN. Добавьте его в Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Выкатить dist на rasputye.vercel.app
        working-directory: dist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@64.1.0 deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-test:
    name: Тестовый стенд
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    # Одна выкладка стенда за раз: миграции тестовой базы не должны идти параллельно.
    concurrency: test-stand
    env:
      VERCEL_PROJECT_ID: prj_zkprAhi4TwEii6GylM8i1ltaP1VN
    steps:
      # Стенд отделён от прода (docs/test-environment.md): свой проект Vercel со своим токеном
      # VERCEL_TOKEN_TEST и свой проект Supabase. Чего нет — то пропускается, тесты test остаются зелёными.
      - name: Что настроено для стенда
        id: cfg
        env:
          VERCEL_TOKEN_TEST: ${{ secrets.VERCEL_TOKEN_TEST }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
        run: |
          if [ -n "$VERCEL_TOKEN_TEST" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Нет секрета VERCEL_TOKEN_TEST — тестовый стенд не выкатывается."; fi
          if [ -n "$TEST_DATABASE_URL" ]; then echo "db=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Нет секрета TEST_DATABASE_URL — миграции тестовой базы не применяются."; fi
          if [ -z "$TEST_SUPABASE_URL" ]; then
            echo "::notice::Нет переменной TEST_SUPABASE_URL — стенд работает только песочницей."
          elif [ -z "$TEST_DATABASE_URL" ]; then
            echo "::warning::Стенд подключён к тестовой базе, но её миграции из CI не применяются."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.deploy == 'true' || steps.cfg.outputs.db == 'true'
      - name: Миграции и проверка прав тестовой базы
        if: steps.cfg.outputs.db == 'true'
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          tools/migrate-test-db.sh
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.deploy == 'true'
        with:
          node-version: 22
      - name: База, плашка и запрет индексации стенда
        if: steps.cfg.outputs.deploy == 'true'
        env:
          TEST_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
          TEST_SUPABASE_KEY: ${{ vars.TEST_SUPABASE_KEY }}
        run: node tools/mark-test-stand.mjs dist "test ${GITHUB_SHA::7}"
      - name: Выкатить test на dropdice-test.vercel.app
        if: steps.cfg.outputs.deploy == 'true'
        working-directory: dist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_TEST }}
        run: npx --yes vercel@64.1.0 deploy --prod --yes --token "$VERCEL_TOKEN"
